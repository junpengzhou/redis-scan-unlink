version: '3.8'

services:
  redis-scan-unlink:
    build: .
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
    command: [ "-pattern", "user:*", "-progress", "true" ]
    depends_on:
      - redis
    volumes:
      - ./data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  redis-data: